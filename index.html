<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>PDF Audio Reader</title>
	<script src="https://cdn.tailwindcss.com?plugins=typography"></script>
	<style>
		#pdf-viewer { height: 24rem; }
	</style>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<style>
		body { font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
	</style>
	<script type="module">
		import * as pdfjsLib from './node_modules/pdfjs-dist/build/pdf.mjs';
		window.pdfjsLib = pdfjsLib;
		const workerUrl = new URL('./node_modules/pdfjs-dist/build/pdf.worker.mjs', window.location.href).toString();
		pdfjsLib.GlobalWorkerOptions.workerSrc = workerUrl;
	</script>
	<script defer src="renderer.js"></script>
	<style>
		/* Prevent flash of unstyled content */
		html { visibility: visible; }
	</style>
	<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob: https://cdn.tailwindcss.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">

</head>
<body class="bg-slate-50">
	<div id="container" class="mx-auto max-w-5xl p-6 md:p-10">
		<div class="rounded-xl border border-slate-200 bg-white/70 backdrop-blur shadow-lg">
			<div class="px-6 py-5 md:px-8 md:py-6 border-b border-slate-200 bg-gradient-to-r from-indigo-600/10 to-cyan-600/10">
				<h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-slate-900">PDF Audio Reader</h1>
				<p class="mt-1 text-slate-600">Turn your PDFs into audio using natural macOS voices.</p>
			</div>

			<div class="px-6 py-5 md:px-8 md:py-6 space-y-4">
				<div class="flex items-center gap-3">
					<input type="file" id="file-input" accept="application/pdf" class="block w-full text-sm text-slate-700 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100" />
				</div>

				<div id="controls" class="flex flex-wrap items-center gap-3">
					<select id="voice-select" class="min-w-[14rem] rounded-lg border-slate-300 bg-white px-3 py-2 text-slate-800 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"></select>
					<button id="refresh-voices" class="inline-flex items-center gap-2 rounded-lg bg-slate-800 px-3 py-2 text-white shadow hover:bg-slate-700">Refresh Voices</button>
					<button id="test-voice" class="inline-flex items-center gap-2 rounded-lg bg-indigo-600 px-3 py-2 text-white shadow hover:bg-indigo-500">Test Voice</button>
					<button id="show-voices-raw" class="inline-flex items-center gap-2 rounded-lg bg-slate-200 px-3 py-2 text-slate-900 shadow hover:bg-slate-300">Show Voices Raw</button>

					<div class="inline-flex items-center gap-2">
						<input type="number" id="rate-input" min="100" max="500" value="200" step="10" class="w-24 rounded-lg border-slate-300 bg-white px-3 py-2 text-slate-800 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
						<span class="text-slate-600">wpm</span>
					</div>

					<div class="flex flex-wrap gap-2">
						<button id="read-pages-btn" class="inline-flex items-center gap-2 rounded-lg bg-emerald-700 px-3 py-2 text-white shadow hover:bg-emerald-600">Read From Page</button>
						<button id="read-btn" class="inline-flex items-center gap-2 rounded-lg bg-emerald-600 px-3 py-2 text-white shadow hover:bg-emerald-500">Read Selection</button>
						<button id="pause-btn" class="inline-flex items-center gap-2 rounded-lg bg-amber-500 px-3 py-2 text-white shadow hover:bg-amber-400">Pause</button>
						<button id="resume-btn" class="inline-flex items-center gap-2 rounded-lg bg-indigo-600 px-3 py-2 text-white shadow hover:bg-indigo-500">Resume</button>
						<button id="stop-btn" class="inline-flex items-center gap-2 rounded-lg bg-rose-600 px-3 py-2 text-white shadow hover:bg-rose-500">Stop</button>
					</div>
				</div>

				<div id="page-nav" class="flex items-center gap-3 text-slate-700">
					<button id="prev-page" class="inline-flex items-center gap-2 rounded-lg bg-slate-100 px-3 py-2 text-slate-900 shadow hover:bg-slate-200">Prev</button>
					<span id="page-info" class="font-semibold text-indigo-700"></span>
					<button id="next-page" class="inline-flex items-center gap-2 rounded-lg bg-slate-100 px-3 py-2 text-slate-900 shadow hover:bg-slate-200">Next</button>
				</div>

				<div id="pdf-viewer" class="prose prose-slate bg-white p-4 rounded-xl border border-slate-200 overflow-auto shadow-inner"></div>
				<div id="voice-status" class="text-sm text-slate-600"></div>

				<textarea id="selected-text" placeholder="Select text in the PDF or paste here..." class="w-full h-40 rounded-xl border border-slate-300 bg-slate-50 p-3 text-slate-800 shadow-sm"></textarea>

				<details class="mt-2">
					<summary class="cursor-pointer text-slate-700">Debug</summary>
					<pre id="debug" class="mt-2 rounded-lg bg-slate-900 p-3 text-slate-100 max-h-60 overflow-auto"></pre>
				</details>
			</div>
		</div>
	</div>
</body>
</html>
